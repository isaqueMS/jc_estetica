<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code | JC Estética</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f6f1;color:#1b1014;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.box{background:#fff;border:1px solid #ece6dc;padding:28px;max-width:420px;width:100%;text-align:center}
h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.25em;font-size:20px;margin:0 0 4px}h1 i{font-style:normal;color:#c19a50}
p{font-size:13px;color:#8d7f80;margin:6px 0 16px}
input{width:100%;padding:12px;border:1px solid #ece6dc;font-size:14px;margin-bottom:12px}
button{width:100%;padding:14px;border:0;background:#1b1014;color:#fff;letter-spacing:.2em;text-transform:uppercase;font-size:11px;cursor:pointer;margin-top:8px}
button.g{background:#c19a50}
#qr{display:flex;justify-content:center;margin:18px 0 6px}
</style></head><body><div class="box">
<h1>JC <i>ESTÉTICA</i></h1>
<p>QR code do cartão digital</p>
<input id="u" value="https://www.jcesteticaefisio.com.br/cartao">
<button onclick="gerar()">Gerar QR code</button>
<div id="qr"></div>
<button class="g" onclick="baixar()">Baixar PNG</button>
</div>
<script>
function gerar(){
  var el=document.getElementById('qr');el.innerHTML='';
  new QRCode(el,{text:document.getElementById('u').value.trim(),width:512,height:512,colorDark:'#1b1014',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  el.querySelectorAll('canvas,img').forEach(function(e){e.style.width='260px';e.style.height='260px'});
}
function baixar(){
  var c=document.querySelector('#qr canvas');if(!c)return;
  var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qrcode-jc-estetica.png';a.click();
}
gerar();
</script></body></html>
